name: Build and deploy EL SIN NOMBRE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # GPU comparison is optional and only runs when explicitly requested.
  workflow_dispatch:
    inputs:
      run_gpu_diagnostics:
        description: 'Ejecutar la comparación GPU opcional de fauna.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Publish only the validated main release; feature branches never deploy to production Pages.
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether this commit changes the game runtime or assets before scheduling expensive browser gates.
  changes:
    name: Detect changed runtime components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.scope.outputs.site }}
      game: ${{ steps.scope.outputs.game }}
      fauna: ${{ steps.scope.outputs.fauna }}
    steps:
      - name: Checkout history for an exact changed-file comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify game and fauna changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "game=true" >> "$GITHUB_OUTPUT"
            echo "fauna=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          fi
          printf '%s\n' "$changed"
          # A production push that changes this workflow must exercise the complete release pipeline.
          # On the review PR itself, source contracts validate the CI change without rebuilding the game.
          if [[ "$EVENT_NAME" == "push" ]] && grep -Fxq '.github/workflows/deploy-pages.yml' <<<"$changed"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "game=true" >> "$GITHUB_OUTPUT"
            echo "fauna=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(index\.html|sw\.js|assets/|inspector/|manifest\.webmanifest|guest-manifest\.webmanifest|guest-file-manifest\.webmanifest|invitado-manifest\.webmanifest|scripts/(build_site\.py|validate_release\.py|fauna-visual-capture\.mjs|nordic/))' <<<"$changed"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(index\.html|sw\.js|assets/|scripts/(build_site\.py|validate_release\.py|start_https_static_server\.py|player-startup-smoke\.mjs|startup-readiness-core\.cjs|game-session-recorder\.js|npc-(agent|dialogue|village)|nordic/))' <<<"$changed"; then
            echo "game=true" >> "$GITHUB_OUTPUT"
          else
            echo "game=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(index\.html|assets/|scripts/(build_site\.py|fauna-visual-capture\.mjs|test_fauna_visual_capture_contract\.cjs|test_wildlife_runtime_contract\.cjs|test_forest_gull_assets\.cjs|create_fauna_contact_sheet\.py))' <<<"$changed"; then
            echo "fauna=true" >> "$GITHUB_OUTPUT"
          else
            echo "fauna=false" >> "$GITHUB_OUTPUT"
          fi

  # Fast source contracts run beside the single release build. Inspector UI checks are path-scoped in their own workflow.
  contracts:
    name: Source regression contracts — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [core, wildlife, world, release]
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
      - name: Set up Node.js for source contracts
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the complete assigned source-contract shard
        env:
          CONTRACT_SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CONTRACT_SUITE" in
            core)
          echo "Test offline navigation suite and four camera modes"
          node scripts/test_navigation_suite_contract.cjs
          echo "Test adaptive graphics quality without sacrificing Performance profile"
          node scripts/test_graphics_quality_contract.cjs
          echo "Test mobile runtime stability without reducing visual quality"
          node scripts/test_mobile_runtime_stability.cjs
          echo "Test mobile startup telemetry and retry affordance"
          node scripts/test_mobile_startup_loading.cjs
          echo "Test civilian NPC specialists and shared-memory contract"
          node scripts/test_npc_agent_core.cjs
          echo "Test autonomous civilian dialogue and four-bubble cap"
          node scripts/test_npc_dialogue_core.cjs
          echo "Test idle-scheduled session telemetry and long-task capture"
          node scripts/test_session_recorder_idle_contract.cjs
          echo "Test actionable post-match performance reports"
          node scripts/test_session_report_diagnostics.cjs
          echo "Check NPC specialist and dialogue runtime syntax"
          node --check scripts/npc-agent-core.js && node --check scripts/npc-agent-runtime.js && node --check scripts/npc-dialogue-core.js && node --check scripts/npc-dialogue-runtime.js
              ;;
            wildlife)
          echo "Test per-animal GLB rig, animation and texture requirements"
          node scripts/test_wildlife_runtime_contract.cjs
          echo "Test four-view fauna capture and report generation"
          node scripts/test_fauna_visual_capture_contract.cjs
              ;;
            inspector)
          echo "Test full Inspector trigger routing"
          node scripts/test_inspector_workflows_contract.cjs
          echo "Test the existing Inspector dashboard and preserve its controls"
          node scripts/test_inspector_dashboard_contract.cjs
          echo "Test the unified horizontal Inspector and session report"
          node scripts/test_inspector_workbench_contract.cjs
          echo "Test bounded scene capture and animated frame integrity"
          node scripts/test_scene_capture_efficiency_contract.cjs
              ;;
            world)
          echo "Test Babylon live-world inspection and anomaly analysis"
          node scripts/test_phase2_world_inspection.mjs
          echo "Test dynamic-safe Babylon spatial selection"
          node scripts/test_quality_spatial_selection.cjs
          echo "Test rendered-ground structure and outpost bedroll placement"
          node scripts/test_coastal_structure_grounding_contract.cjs
          echo "Test BeachState coast and toroidal footprint atlas"
          node scripts/test_beach_state.cjs
          echo "Test three-layer coast rendering contract and water film"
          node scripts/test_water_shore.cjs
          echo "Test coastal mesh continuity and 5 cm seam limit"
          node scripts/test_coastal_mesh_continuity.cjs
          echo "Test separate seabed, transparent water and advancing film geometry"
          node scripts/test_coastal_interaction.cjs
          echo "Test 13-island campaign and naval invasion integration"
          node scripts/test_island_campaign.cjs
          echo "Test Phase 2 builder, offline and world-inspection integration"
          node scripts/test_phase2_build_contract.mjs
              ;;
            release)
          echo "Test release version and packaging contract"
          node scripts/test_release_contract.cjs
          echo "Test unified day-night atmosphere clock and APIs"
          node scripts/test_atmosphere_system.cjs
          echo "Test runtime and offline Service Worker publication gate"
          node scripts/test_game_runtime_acceptance_contract.cjs
          echo "Test cached and offline startup readiness decisions"
          node scripts/test_startup_readiness_core.cjs
              ;;
            *) echo "Unknown contract suite: $CONTRACT_SUITE" >&2; exit 2 ;;
          esac

  build:
    name: Build and validate the complete game
    if: needs.changes.outputs.site == 'true'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      playwright-version: ${{ steps.playwright_version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve the exact Playwright version for browser-cache compatibility
        if: needs.changes.outputs.game == 'true' || needs.changes.outputs.fauna == 'true'
        id: playwright_version
        shell: bash
        run: |
          version="$(npm view playwright version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright package and matching Chromium cache
        if: needs.changes.outputs.game == 'true' || needs.changes.outputs.fauna == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: el-sin-nombre-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Compute the stable external asset cache fingerprint
        id: asset_cache_fingerprint
        run: echo "fingerprint=$(python scripts/asset_cache_fingerprint.py)" >> "$GITHUB_OUTPUT"

      - name: Restore verified external game assets
        uses: actions/cache@v4
        with:
          path: .asset-cache/
          key: el-sin-nombre-assets-${{ runner.os }}-${{ runner.arch }}-${{ steps.asset_cache_fingerprint.outputs.fingerprint }}-${{ github.run_id }}
          restore-keys: |
            el-sin-nombre-assets-${{ runner.os }}-${{ runner.arch }}-${{ steps.asset_cache_fingerprint.outputs.fingerprint }}-
            el-sin-nombre-assets-${{ runner.os }}-${{ runner.arch }}-


      - name: Validate the local HTTPS acceptance server
        run: python -m py_compile scripts/start_https_static_server.py

      - name: Download all resources, build dist and run release validation
        run: python scripts/build_site.py
      - name: Verify asset cache manifest and corruption handling
        run: python scripts/test_asset_cache_integrity.py

      - name: Save downloaded assets even when another resource fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .asset-cache/
          key: el-sin-nombre-assets-${{ runner.os }}-${{ runner.arch }}-${{ steps.asset_cache_fingerprint.outputs.fingerprint }}-${{ github.run_id }}
      - name: Verify realistic forest spacing and gull flight clips
        run: node scripts/test_forest_gull_assets.cjs
      - name: Verify night-effect CPU budgets without reducing Quality
        run: node scripts/test_subsystem_performance_contract.cjs
      - name: Verify every mandatory resource is packaged and startup gate is wired
        run: node scripts/test_startup_resource_gate.cjs


      - name: Include the independent Inspector Center in the published site
        run: |
          mkdir -p dist/inspector
          cp -R inspector/. dist/inspector/

      - name: Verify Inspector Phase 1 dependencies are published
        run: node scripts/test_inspector_phase1_packaging.cjs

      - name: Prepare shared Playwright and Chromium cache for parallel browser gates
        if: needs.changes.outputs.game == 'true' || needs.changes.outputs.fauna == 'true'
        run: |
          npm install --no-save --no-package-lock "playwright@${{ steps.playwright_version.outputs.version }}"
          npx playwright install chromium








      - name: Upload validated site for PR inspection
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Configure native GitHub Pages deployment
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete game website to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  startup:
    name: Real gameplay and offline Service Worker acceptance
    if: needs.changes.outputs.game == 'true'
    needs: [build, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact release candidate for runtime acceptance
        uses: actions/checkout@v4
      - name: Set up Python for HTTPS acceptance server
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for runtime acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the exact Playwright and Chromium cache warmed by the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: el-sin-nombre-playwright-${{ runner.os }}-${{ runner.arch }}-${{ needs.build.outputs.playwright-version }}-chromium
      - name: Install the exact cached Playwright version
        run: npm install --no-save --no-package-lock "playwright@${{ needs.build.outputs.playwright-version }}"
      - name: Verify cached Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Download the exact site package built and validated above
        uses: actions/download-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist
      - name: Confirm the downloaded package is complete
        run: test -s dist/index.html && test -s dist/assets/asset-manifest.json
      - name: Start the built release on local HTTPS for Service Worker acceptance
        shell: bash
        run: |
          mkdir -p artifacts/player-startup
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/player-test.key" -out "$RUNNER_TEMP/player-test.crt" -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          python scripts/start_https_static_server.py --directory dist --bind 127.0.0.1 --port 4175 --cert "$RUNNER_TEMP/player-test.crt" --key "$RUNNER_TEMP/player-test.key" > artifacts/player-startup/https-server.log 2>&1 &
          echo $! > artifacts/player-startup/https-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://localhost:4175/ > /dev/null; then
              echo "Built release HTTPS server is responding."
              exit 0
            fi
            sleep 1
          done
          cat artifacts/player-startup/https-server.log
          exit 1

      - name: Verify startup, required NPCs, gameplay and offline Service Worker restart before publish
        env:
          PLAYER_TEST_URL: https://localhost:4175/
        run: node scripts/player-startup-smoke.mjs

      - name: Stop runtime acceptance HTTPS server
        if: always()
        run: |
          if [ -f artifacts/player-startup/https-server.pid ]; then
            kill "$(cat artifacts/player-startup/https-server.pid)" 2>/dev/null || true
          fi
      - name: Preserve runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-runtime-release-${{ github.sha }}
          path: artifacts/player-startup/
          if-no-files-found: warn
          retention-days: 30

  fauna:
    name: Required fauna rigs, animation, textures and four-view visual acceptance
    if: needs.changes.outputs.fauna == 'true'
    needs: [build, changes]
    runs-on: ubuntu-24.04
    # Bound the complete fauna job, including setup and artifact preservation.
    timeout-minutes: 25
    steps:
      - name: Checkout exact release candidate for fauna acceptance
        uses: actions/checkout@v4
      - name: Set up Python for fauna HTTPS server
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for fauna acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the exact Playwright and Chromium cache warmed by the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: el-sin-nombre-playwright-${{ runner.os }}-${{ runner.arch }}-${{ needs.build.outputs.playwright-version }}-chromium
      - name: Install the exact cached Playwright version
        run: npm install --no-save --no-package-lock "playwright@${{ needs.build.outputs.playwright-version }}"
      - name: Verify cached Chromium and system dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Download the exact site package built and validated above
        uses: actions/download-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist
      - name: Confirm the downloaded package is complete
        run: test -s dist/index.html && test -s dist/assets/asset-manifest.json
      - name: Start the same built release for isolated CPU fauna acceptance
        shell: bash
        run: |
          mkdir -p artifacts/fauna-visual-captures
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/fauna-test.key" -out "$RUNNER_TEMP/fauna-test.crt" -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          python scripts/start_https_static_server.py --directory dist --bind 127.0.0.1 --port 4175 --cert "$RUNNER_TEMP/fauna-test.crt" --key "$RUNNER_TEMP/fauna-test.key" > artifacts/fauna-visual-captures/https-server.log 2>&1 &
          echo $! > artifacts/fauna-visual-captures/https-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://localhost:4175/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/fauna-visual-captures/https-server.log
          exit 1
      - name: Verify mobile fauna rigs on CPU skinning, animations, textures and four-view visuals before publish
        # The capture script has a 15-minute global deadline and per-evaluation watchdogs.
        timeout-minutes: 18
        env:
          FAUNA_TEST_URL: https://localhost:4175/
          FAUNA_SKINNING_MODE: cpu
        run: node scripts/fauna-visual-capture.mjs

      - name: Build fauna contact sheet and visual failure report
        if: always()
        run: |
          if [ -s artifacts/fauna-visual-captures/manifest.json ]; then
            python -m pip install --disable-pip-version-check pillow
            python scripts/create_fauna_contact_sheet.py artifacts/fauna-visual-captures
          else
            echo "No fauna manifest was produced; raw diagnostic logs will still be preserved."
          fi

      - name: Stop CPU fauna acceptance HTTPS server
        if: always()
        run: |
          if [ -f artifacts/fauna-visual-captures/https-server.pid ]; then
            kill "$(cat artifacts/fauna-visual-captures/https-server.pid)" 2>/dev/null || true
          fi
      - name: Preserve fauna visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-fauna-release-${{ github.sha }}
          path: artifacts/fauna-visual-captures/
          if-no-files-found: warn
          retention-days: 30


  fauna-gpu-diagnostic:
    name: Optional GPU skinning comparison captures
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu_diagnostics == true
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout exact release candidate for GPU diagnostics
        uses: actions/checkout@v4
      - name: Set up Python for GPU diagnostic server
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for GPU diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the exact Playwright and Chromium cache warmed by the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: el-sin-nombre-playwright-${{ runner.os }}-${{ runner.arch }}-${{ needs.build.outputs.playwright-version }}-chromium
      - name: Install the exact cached Playwright version
        run: npm install --no-save --no-package-lock "playwright@${{ needs.build.outputs.playwright-version }}"
      - name: Verify cached Chromium and system dependencies
        id: playwright_install
        run: npx playwright install --with-deps chromium
      - name: Download the exact site package built and validated above
        uses: actions/download-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist
      - name: Confirm the downloaded package is complete
        run: test -s dist/index.html && test -s dist/assets/asset-manifest.json
      - name: Start the same built release for GPU diagnostic captures
        shell: bash
        run: |
          mkdir -p artifacts/fauna-visual-captures-gpu
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/fauna-gpu-test.key" -out "$RUNNER_TEMP/fauna-gpu-test.crt" -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          python scripts/start_https_static_server.py --directory dist --bind 127.0.0.1 --port 4175 --cert "$RUNNER_TEMP/fauna-gpu-test.crt" --key "$RUNNER_TEMP/fauna-gpu-test.key" > artifacts/fauna-visual-captures-gpu/https-server.log 2>&1 &
          echo $! > artifacts/fauna-visual-captures-gpu/https-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://localhost:4175/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/fauna-visual-captures-gpu/https-server.log
          exit 1
      - name: Diagnostic A/B capture with GPU skinning fallback (non-release acceptance)
        if: always() && steps.playwright_install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 18
        env:
          FAUNA_TEST_URL: https://localhost:4175/
          FAUNA_SKINNING_MODE: gpu
          FAUNA_CAPTURE_OUTPUT: artifacts/fauna-visual-captures-gpu
        run: node scripts/fauna-visual-capture.mjs

      - name: Stop GPU diagnostic HTTPS server
        if: always()
        run: |
          if [ -f artifacts/fauna-visual-captures-gpu/https-server.pid ]; then
            kill "$(cat artifacts/fauna-visual-captures-gpu/https-server.pid)" 2>/dev/null || true
          fi
      - name: Preserve GPU skinning fallback diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-fauna-gpu-diagnostic-${{ github.sha }}
          path: artifacts/fauna-visual-captures-gpu/
          if-no-files-found: warn
          retention-days: 30


  deploy:
    name: Publish the exact validated build on GitHub Pages
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.site == 'true' &&
      needs.build.result == 'success' &&
      needs.contracts.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.startup.result == 'success' || needs.startup.result == 'skipped') &&
      (needs.fauna.result == 'success' || needs.fauna.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, contracts, startup, fauna, changes]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
