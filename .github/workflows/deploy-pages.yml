name: Build and deploy EL SIN NOMBRE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new release group lets the validated build supersede an orphaned older Pages publish.
concurrency:
  group: github-pages-release-0-6-274
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate the complete game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test offline navigation suite and four camera modes
        run: node scripts/test_navigation_suite_contract.cjs
      - name: Test bounded scene capture and animated frame integrity
        run: node scripts/test_scene_capture_efficiency_contract.cjs
      - name: Test rendered-ground structure and outpost bedroll placement
        run: node scripts/test_coastal_structure_grounding_contract.cjs
      - name: Test BeachState coast and toroidal footprint atlas
        run: node scripts/test_beach_state.cjs
      - name: Test three-layer coast rendering contract and water film
        run: node scripts/test_water_shore.cjs
      - name: Test separate seabed, transparent water and advancing film geometry
        run: node scripts/test_coastal_interaction.cjs
      - name: Test 13-island campaign and naval invasion integration
        run: node scripts/test_island_campaign.cjs

      - name: Download all resources, build dist and run release validation
        run: python scripts/build_site.py

      - name: Upload validated site for PR inspection
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure native GitHub Pages deployment
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete game website to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  recover-pages:
    name: Release orphaned GitHub Pages deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: write
      pages: write
    steps:
      - name: Cancel stuck workflow attempts and stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retire known orphaned attempts from previous Pages incidents.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42413262099/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42414967473/cancel" || true
          # The 0.6.226 deploy-pages step remained in progress after build and upload succeeded.
          # This newer, fully validated 0.6.227 release supersedes that orphaned attempt.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42421155099/cancel" || true
          # Pages deployment IDs are commit SHAs, not Actions run IDs.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/6b242b60daac742a4d4a6aa7f51bcdfd4db49772/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/f8c0f011c0fb168db466bf6c7477fc4e141ceb71/cancel" || true
          echo "Recovery requests sent. The next job will create a fresh Pages deployment."

  deploy:
    name: Publish the exact validated build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, recover-pages]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
