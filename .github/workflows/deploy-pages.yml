name: Build and deploy EL SIN NOMBRE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publish only the validated main release; feature branches never deploy to production Pages.
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate the complete game
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test offline navigation suite and four camera modes
        run: node scripts/test_navigation_suite_contract.cjs
      - name: Test adaptive graphics quality without sacrificing Performance profile
        run: node scripts/test_graphics_quality_contract.cjs
      - name: Test release version and packaging contract
        run: node scripts/test_release_contract.cjs
      - name: Test unified day-night atmosphere clock and APIs
        run: node scripts/test_atmosphere_system.cjs
      - name: Test bounded scene capture and animated frame integrity
        run: node scripts/test_scene_capture_efficiency_contract.cjs
      - name: Test rendered-ground structure and outpost bedroll placement
        run: node scripts/test_coastal_structure_grounding_contract.cjs
      - name: Test BeachState coast and toroidal footprint atlas
        run: node scripts/test_beach_state.cjs
      - name: Test three-layer coast rendering contract and water film
        run: node scripts/test_water_shore.cjs
      - name: Test coastal mesh continuity and 5 cm seam limit
        run: node scripts/test_coastal_mesh_continuity.cjs
      - name: Test separate seabed, transparent water and advancing film geometry
        run: node scripts/test_coastal_interaction.cjs
      - name: Test 13-island campaign and naval invasion integration
        run: node scripts/test_island_campaign.cjs
      - name: Test runtime and offline Service Worker publication gate
        run: node scripts/test_game_runtime_acceptance_contract.cjs

      - name: Validate the local HTTPS acceptance server
        run: python -m py_compile scripts/start_https_static_server.py

      - name: Download all resources, build dist and run release validation
        run: python scripts/build_site.py

      - name: Include the independent Inspector Center in the published site
        run: |
          mkdir -p dist/inspector
          cp -R inspector/. dist/inspector/

      - name: Install Playwright and Chromium for real startup acceptance
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start the built release on local HTTPS for Service Worker acceptance
        shell: bash
        run: |
          mkdir -p artifacts/player-startup
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/player-test.key" -out "$RUNNER_TEMP/player-test.crt" -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          python scripts/start_https_static_server.py --directory dist --bind 127.0.0.1 --port 4175 --cert "$RUNNER_TEMP/player-test.crt" --key "$RUNNER_TEMP/player-test.key" > artifacts/player-startup/https-server.log 2>&1 &
          echo $! > artifacts/player-startup/https-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://localhost:4175/ > /dev/null; then
              echo "Built release HTTPS server is responding."
              exit 0
            fi
            sleep 1
          done
          cat artifacts/player-startup/https-server.log
          exit 1

      - name: Verify startup, required NPCs, gameplay and offline Service Worker restart before publish
        env:
          PLAYER_TEST_URL: https://localhost:4175/
        run: node scripts/player-startup-smoke.mjs

      - name: Preserve runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-runtime-release-${{ github.sha }}
          path: artifacts/player-startup/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload validated site for PR inspection
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure native GitHub Pages deployment
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete game website to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publish the exact validated build on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
