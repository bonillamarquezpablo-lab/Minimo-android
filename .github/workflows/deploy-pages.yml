name: Build and deploy EL SIN NOMBRE

on:
  push:
    branches: [main, feature/hrafn-before-after-inspector]
  workflow_dispatch:

permissions:
  contents: read

# One release pipeline per branch; the validated candidate can be published without merging into main.
concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate the complete game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test offline navigation suite and four camera modes
        run: node scripts/test_navigation_suite_contract.cjs
      - name: Test adaptive graphics quality without sacrificing Performance profile
        run: node scripts/test_graphics_quality_contract.cjs
      - name: Test release version and packaging contract
        run: node scripts/test_release_contract.cjs
      - name: Test unified day-night atmosphere clock and APIs
        run: node scripts/test_atmosphere_system.cjs
      - name: Test bounded scene capture and animated frame integrity
        run: node scripts/test_scene_capture_efficiency_contract.cjs
      - name: Test rendered-ground structure and outpost bedroll placement
        run: node scripts/test_coastal_structure_grounding_contract.cjs
      - name: Test BeachState coast and toroidal footprint atlas
        run: node scripts/test_beach_state.cjs
      - name: Test three-layer coast rendering contract and water film
        run: node scripts/test_water_shore.cjs
      - name: Test coastal mesh continuity and 5 cm seam limit
        run: node scripts/test_coastal_mesh_continuity.cjs
      - name: Test separate seabed, transparent water and advancing film geometry
        run: node scripts/test_coastal_interaction.cjs
      - name: Test 13-island campaign and naval invasion integration
        run: node scripts/test_island_campaign.cjs

      - name: Download all resources, build dist and run release validation
        run: python scripts/build_site.py

      - name: Include the independent Inspector Center in the published site
        run: |
          mkdir -p dist/inspector
          cp -R inspector/. dist/inspector/

      - name: Upload validated site for PR inspection
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure native GitHub Pages deployment
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete game website to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publish the exact validated build on GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/hrafn-before-after-inspector')
    environment:
      name: github-pages-candidate
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
