name: Build and publish EL SIN NOMBRE web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: el-sin-nombre-web-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and package every runtime resource
        run: python scripts/build_site.py

      - name: Publish the complete static game to the distribution branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy EL SIN NOMBRE 0.6.68 web package"

      - name: Write the public HTTPS game link
        run: |
          {
            echo "## EL SIN NOMBRE is published"
            echo ""
            echo "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/index.html"
            echo ""
            echo "All runtime assets are served from this HTTPS package."
          } >> "${GITHUB_STEP_SUMMARY}"
