name: Build and deploy EL SIN NOMBRE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate the complete game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download all resources, build dist and run release validation
        run: python scripts/build_site.py

      - name: Upload validated site for PR inspection
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Configure native GitHub Pages deployment
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete game website to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publish the exact validated build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
