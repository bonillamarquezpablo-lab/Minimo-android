name: Coastal reference capture

on:
  push:
    branches: [test/coastal-reference-0.6.272]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coastal-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Build game and capture 27 deterministic coast states
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate coastal state and geometry contracts
        run: |
          node scripts/test_coastal_reference_contract.cjs
          node scripts/test_beach_state.cjs
          node scripts/test_water_shore.cjs
          node scripts/test_coastal_interaction.cjs
          node scripts/test_island_campaign.cjs

      - name: Build complete game and verify all packaged assets
        run: python scripts/build_site.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local built-site server
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/elsn-http.log 2>&1 &
          echo $! > /tmp/elsn-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/elsn-http.log
          exit 1

      - name: Capture 27 deterministic coastal reference images
        env:
          COASTAL_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/coastal-reference.mjs

      - name: Upload reference images and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: coastal-reference-${{ github.sha }}
          path: artifacts/coastal-reference/
          if-no-files-found: error
          retention-days: 30
