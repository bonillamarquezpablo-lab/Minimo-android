name: Coastal reference capture

on:
  pull_request:
    branches: [main, test/coastal-reference-0.6.272]
  # Run the beach-only visual suite on the isolated coastal branch. This does not
  # activate the separate Pages release workflow.
  push:
    branches: [fix/coastal-water-surface-0.6.273]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coastal-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reference:
    name: Build game and capture 36 coastal and ridge views
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate coastal state and geometry contracts
        run: |
          node --check scripts/coastal-reference.mjs
          node scripts/test_coastal_reference_contract.cjs
          node scripts/test_water_diagnostics.cjs
          node scripts/test_coastal_geometry.cjs
          node scripts/test_beach_state.cjs
          node scripts/test_water_shore.cjs
          node scripts/test_coastal_interaction.cjs
          node scripts/test_island_campaign.cjs

      - name: Build complete game and verify all packaged assets
        run: python scripts/build_site.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local built-site server
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/elsn-http.log 2>&1 &
          echo $! > /tmp/elsn-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/elsn-http.log
          exit 1

      - name: Capture 36 deterministic coastal and ridge-occlusion images (one game load)
        env:
          COASTAL_TEST_URL: http://127.0.0.1:4173/
        run: node scripts/coastal-reference.mjs

      - name: Install Pillow for the contact sheet
        if: always()
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build one PNG contact sheet from all 36 captures
        if: always()
        run: python scripts/create_coastal_contact_sheet.py

      - name: Upload 36 screenshots, JSON manifest and contact sheet plus A/B shadow frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coastal-reference-${{ github.sha }}
          path: artifacts/coastal-reference/
          if-no-files-found: warn
          retention-days: 30

  character-startup:
    name: Verify real Viking GLB startup independently
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build complete game and verify packaged assets
        run: python scripts/build_site.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local built-site server
        run: |
          python3 -m http.server 4174 --directory dist > /tmp/elsn-player-http.log 2>&1 &
          echo $! > /tmp/elsn-player-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/elsn-player-http.log
          exit 1

      - name: Test real Viking GLB load and one in-page retry
        env:
          PLAYER_TEST_URL: http://127.0.0.1:4174/
        run: node scripts/player-startup-smoke.mjs

      - name: Upload independent player startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-startup-${{ github.sha }}
          path: artifacts/player-startup/
          if-no-files-found: warn
          retention-days: 30
