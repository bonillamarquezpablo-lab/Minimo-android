name: Inspector único — EL SIN NOMBRE
# S26 Ultra graphics audit: always compare mobile visuals and runtime frame budgets before release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'inspector/**'
      - 'README.md'
      - 'vercel.json'
      - 'scripts/test_inspector_dashboard_contract.cjs'
      - 'scripts/test_inspector_workflows_contract.cjs'
      - 'scripts/test_hrafn_before_after_contract.cjs'
  workflow_dispatch:
    inputs:
      inspection_level:
        description: 'Nivel de inspección: rápido para cambios pequeños, completo para cambios importantes o profundo antes de publicar.'
        required: true
        type: choice
        options:
          - quick
          - complete
          - deep
        default: quick
      before_ref:
        description: 'Rama o etiqueta que sirve como ANTES de la comparación visual.'
        required: false
        type: string
        default: ''
      capture_plan:
        description: 'Una sola inspección: inventario completo, texturas, estructuras, agua, costa, pruebas y cámaras desde el agua. Hasta 120 capturas.'
        required: false
        type: string
        default: '[{"id":"inspeccion-unica-hrafn","zone":{"label":"Bahía de Hrafn — todas las construcciones detectadas","center":{"x":28,"y":2.2,"z":143},"radiusMeters":27,"focus":"structures","maxTargets":12,"cameraDistanceMeters":9,"angles":[0,45,90,135,180,225,270,315],"times":[37],"tides":["natural"],"observationPoint":{"x":28,"y":6,"z":236.3},"observationHeightOffsets":[0,2.5],"includeTopDown":false}}]'

permissions:
  contents: write

concurrency:
  # Isolate each candidate commit so a stale runner cannot block the newest inspection.
  group: scene-capture-s26-graphics-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unified-inspector:
    name: 'Inspector único: todas las pruebas, diagnósticos y capturas'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the exact baseline commit for before/after
        if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.inspection_level == 'deep')
        id: baseline
        shell: bash
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_BASE_REF: ${{ inputs.before_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_REF="$PULL_REQUEST_BASE_SHA"
            BASE_SHA="$PULL_REQUEST_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            BASE_REF="$PUSH_BEFORE_SHA"
            if [ -z "$BASE_REF" ] || [[ "$BASE_REF" =~ ^0+$ ]]; then
              BASE_REF="main^"
            fi
            git fetch --no-tags origin "$BASE_REF"
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_BASE_REF" ]; then
            BASE_REF="$DISPATCH_BASE_REF"
            git fetch --no-tags origin "$BASE_REF"
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          else
            BASE_REF="$GITHUB_SHA^"
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          if [ "$BASE_SHA" = "$GITHUB_SHA" ]; then
            echo "Baseline and candidate resolve to the same commit; refusing a meaningless A/B comparison."
            exit 1
          fi
          echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Hrafn baseline: $BASE_REF ($BASE_SHA)"

      - name: Build the baseline game in an isolated worktree
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.inspection_level == 'deep')
        env:
          HRAFN_BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          CANDIDATE_VERSION="$(sed -n 's/^EXPECTED_VERSION = "\([^"]*\)"/\1/p' scripts/validate_release.py | head -n1)"
          if [ -z "$CANDIDATE_VERSION" ]; then
            echo "Cannot determine the candidate game version from scripts/validate_release.py."
            exit 1
          fi
          BASELINE_SHA="$HRAFN_BASE_SHA"
          BASELINE_BUILT=0
          for attempt in $(seq 1 32); do
            git worktree add --detach "$RUNNER_TEMP/hrafn-before-source" "$BASELINE_SHA"
            BASELINE_VERSION="$(sed -n 's/^EXPECTED_VERSION = "\([^"]*\)"/\1/p' "$RUNNER_TEMP/hrafn-before-source/scripts/validate_release.py" | head -n1)"
            if [ "$BASELINE_VERSION" = "$CANDIDATE_VERSION" ]; then
              echo "Skipping baseline $BASELINE_SHA: it is the same game release $BASELINE_VERSION as the candidate."
              git worktree remove --force "$RUNNER_TEMP/hrafn-before-source"
              NEXT_SHA="$(git rev-parse "$BASELINE_SHA^" 2>/dev/null || true)"
              if [ -z "$NEXT_SHA" ]; then break; fi
              BASELINE_SHA="$NEXT_SHA"
              continue
            fi
            if python "$RUNNER_TEMP/hrafn-before-source/scripts/build_site.py"; then
              BASELINE_BUILT=1
              break
            fi
            echo "Baseline $BASELINE_SHA failed on attempt $attempt; looking for the previous buildable release."
            git worktree remove --force "$RUNNER_TEMP/hrafn-before-source"
            NEXT_SHA="$(git rev-parse "$BASELINE_SHA^" 2>/dev/null || true)"
            if [ -z "$NEXT_SHA" ]; then break; fi
            BASELINE_SHA="$NEXT_SHA"
          done
          if [ "$BASELINE_BUILT" -ne 1 ]; then
            echo "No distinct buildable baseline found in the 32-commit recovery window."
            exit 1
          fi
          echo "Hrafn A/B baseline selected: $BASELINE_SHA (release $BASELINE_VERSION; candidate $CANDIDATE_VERSION)"
          mv "$RUNNER_TEMP/hrafn-before-source/dist" "$RUNNER_TEMP/hrafn-before-dist"
          test -s "$RUNNER_TEMP/hrafn-before-dist/index.html"

      - name: Install report image support
        run: python -m pip install Pillow

      - name: Validate every inspector module and contract
        run: |
          python scripts/inspect_structure_repair_source.py
          node --check scripts/run-unified-inspector.mjs
          node --check scripts/hrafn-before-after.mjs
          node scripts/test_hrafn_before_after_contract.cjs
          node scripts/test_inspector_capture_skip_contract.cjs
          node --check scripts/player-startup-smoke.mjs
          node --check scripts/texture-readiness-smoke.mjs
          node --check scripts/coastal-structure-grounding-smoke.mjs
          node --check scripts/coastal-reference.mjs
          node --check scripts/scene-capture-inspection.mjs
          node --check scripts/custom-scene-capture.mjs
          node scripts/test_scene_capture_efficiency_contract.cjs
          node scripts/test_texture_readiness_contract.cjs
          node scripts/test_coastal_structure_grounding_contract.cjs
          node scripts/test_capture_reliability_contract.cjs
          node scripts/test_inspector_dashboard_contract.cjs
          node scripts/test_inspector_workflows_contract.cjs
          node scripts/test_graphics_quality_contract.cjs

      - name: Build the complete game and packaged assets
        run: python scripts/build_site.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node -e "const fs=require('node:fs');const {chromium}=require('playwright');const executable=chromium.executablePath();if(!fs.existsSync(executable))throw new Error('Chromium binary missing: '+executable);console.log('Chromium ready:',executable)"

      - name: Start baseline and candidate game servers for the unified inspection
        env:
          INSPECTOR_LEVEL: ${{ inputs.inspection_level || ((github.event_name == 'push' || github.event_name == 'pull_request') && 'deep' || 'complete') }}
        run: |
          if [ "$INSPECTOR_LEVEL" = "deep" ]; then
            python3 -m http.server 4176 --directory "$RUNNER_TEMP/hrafn-before-dist" > /tmp/elsn-hrafn-before-http.log 2>&1 &
            echo $! > /tmp/elsn-hrafn-before-http.pid
          fi
          python3 -m http.server 4175 --directory dist > /tmp/elsn-hrafn-after-http.log 2>&1 &
          echo $! > /tmp/elsn-hrafn-after-http.pid
          for attempt in $(seq 1 45); do
            BEFORE_OK=0
            AFTER_OK=0
            if [ "$INSPECTOR_LEVEL" = "deep" ]; then curl --fail --silent http://127.0.0.1:4176/ > /dev/null && BEFORE_OK=1 || true; else BEFORE_OK=1; fi
            curl --fail --silent http://127.0.0.1:4175/ > /dev/null && AFTER_OK=1 || true
            if [ "$BEFORE_OK" = "1" ] && [ "$AFTER_OK" = "1" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/elsn-hrafn-before-http.log
          cat /tmp/elsn-hrafn-after-http.log
          exit 1

      - name: Run the single unified inspector
        env:
          INSPECTOR_TEST_URL: http://127.0.0.1:4175/
          HRAFN_BEFORE_URL: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.inspection_level == 'deep')) && 'http://127.0.0.1:4176/' || '' }}
          HRAFN_AFTER_URL: http://127.0.0.1:4175/
          CAPTURE_PLAN_INPUT: ${{ inputs.capture_plan }}
          CAPTURE_SEED: '20261110'
          INSPECTOR_LEVEL: ${{ inputs.inspection_level || (github.event_name == 'push' && 'deep' || 'complete') }}
          INSPECTOR_GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
          INSPECTOR_STATUS_BRANCH: inspector-status
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            export CAPTURE_PLAN_JSON="$CAPTURE_PLAN_INPUT"
          else
            export CAPTURE_PLAN_JSON="$(cat scripts/scene-capture-plan.json)"
          fi
          node scripts/run-unified-inspector.mjs

      - name: Upload diagnostic manifests before the visual bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-diagnostics-${{ github.sha }}
          path: |
            artifacts/unified-inspector/manifest.json
            artifacts/unified-inspector/inspection-report.md
            artifacts/player-startup/manifest.json
            artifacts/texture-readiness-smoke/manifest.json
            artifacts/texture-readiness-smoke/coastal-inspection.json
            artifacts/structure-grounding/manifest.json
            artifacts/coastal-reference/*.json
            artifacts/custom-scene-captures/manifest.json
            artifacts/custom-scene-captures/inspection-report.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Upload the complete inspection, captures and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-inspector-unico-${{ github.sha }}
          path: |
            artifacts/unified-inspector/
            artifacts/player-startup/
            artifacts/texture-readiness-smoke/
            artifacts/structure-grounding/
            artifacts/coastal-reference/
            artifacts/custom-scene-captures/
            artifacts/hrafn-before-after/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
        continue-on-error: true
