name: Temporary candidate build + player smoke (visual captures bypassed)

on:
  pull_request:
    branches:
      - fix/inspector-workflow-and-runtime-guards
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: candidate-build-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  candidate-build-smoke:
    name: Build, contract checks and real player startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout merged candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate structure source and JavaScript syntax
        shell: bash
        run: |
          python scripts/inspect_structure_repair_source.py
          for file in scripts/*.mjs; do
            node --check "$file"
          done

      - name: Run fast regression contracts
        run: |
          node scripts/test_hrafn_before_after_contract.cjs
          node scripts/test_texture_readiness_contract.cjs
          node scripts/test_scene_capture_efficiency_contract.cjs
          node scripts/test_coastal_structure_grounding_contract.cjs
          node scripts/test_capture_reliability_contract.cjs
          node scripts/test_inspector_dashboard_contract.cjs

      - name: Build the complete game and packaged assets
        run: python scripts/build_site.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
          node -e "const fs=require('node:fs');const {chromium}=require('playwright');const executable=chromium.executablePath();if(!fs.existsSync(executable))throw new Error('Chromium binary missing: '+executable);console.log('Chromium ready:',executable)"

      - name: Start candidate server
        shell: bash
        run: |
          python3 -m http.server 4174 --directory dist > /tmp/elsn-candidate-http.log 2>&1 &
          echo $! > /tmp/elsn-candidate-http.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/elsn-candidate-http.log
          exit 1

      - name: Verify real Viking player startup (no visual reference captures)
        env:
          PLAYER_TEST_URL: http://127.0.0.1:4174/
        run: node scripts/player-startup-smoke.mjs

      - name: Upload candidate build and startup manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el-sin-nombre-candidate-build-${{ github.sha }}
          path: |
            dist/
            artifacts/player-startup/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
