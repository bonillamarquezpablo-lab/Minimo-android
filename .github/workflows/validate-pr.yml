name: Validate EL SIN NOMBRE pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test bounded startup scene warm-up
        run: node scripts/test_startup_guard.cjs

      - name: Test GLB background pipeline and fallbacks
        run: node scripts/test_glb_loading.cjs

      - name: Test BeachState coast and toroidal footprint atlas
        run: node scripts/test_beach_state.cjs

      - name: Build and validate game resources
        run: python scripts/build_site.py

      - name: Verify generated website entry point
        run: test -s dist/index.html
