name: Inspector Center — dashboard checks

on:
  push:
    branches: [feature/inspector-center-dashboard]
  pull_request:
    branches: [feature/tiered-inspector-levels]

permissions:
  contents: read

jobs:
  dashboard:
    name: Validate independent dashboard and progress publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed dashboard
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GitHub Actions YAML syntax
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "YAML OK: #{path}" }' .github/workflows/coastal-reference.yml .github/workflows/deploy-pages.yml .github/workflows/inspector-center-checks.yml
      - name: Validate inspector runner syntax
        run: node --check scripts/run-unified-inspector.mjs
      - name: Validate visual comparison contract
        run: node scripts/test_hrafn_before_after_contract.cjs
      - name: Validate dashboard script and security contract
        run: node scripts/test_inspector_dashboard_contract.cjs
      - name: Validate workflow and version-routing contracts
        run: node scripts/test_inspector_workflows_contract.cjs
